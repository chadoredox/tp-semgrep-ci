name: DevSecOps - Semgrep SAST Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write # Requis pour publier les alertes SARIF dans l'onglet Security de GitHub

jobs:
  semgrep-sast:
    name: Semgrep SAST Quality Gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan \
            --config "p/default" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep-results.sarif \
            --error

      # GitHub code scanning ignore le champ SARIF "suppressions" : sans ce filtre,
      # une exception nosemgrep valide resterait une alerte ouverte dans Security.
      - name: Remove suppressed findings from SARIF
        if: always()
        run: |
          python - <<'PY'
          import json

          path = "semgrep-results.sarif"
          with open(path, encoding="utf-8") as fh:
              sarif = json.load(fh)
          for run in sarif.get("runs", []):
              run["results"] = [
                  result
                  for result in run.get("results", [])
                  if not result.get("suppressions")
              ]
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(sarif, fh)
          PY

      - name: Upload SARIF report to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        if: always() # Publie le rapport même si Semgrep a trouvé des failles et a échoué
        with:
          sarif_file: semgrep-results.sarif
